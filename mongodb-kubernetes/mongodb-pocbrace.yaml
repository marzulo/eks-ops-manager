apiVersion: mongodb.com/v1
kind: MongoDB
metadata:
  name: pocbrace
  namespace: mongodb
spec:
  members: 3
  version: "8.0.32-ent"
  credentials: organization-secret
  type: ReplicaSet
  featureCompatibilityVersion: "8.0"
  persistent: true

  opsManager:
    configMapRef:
      name: pocbrace  # Must match metadata.name in ConfigMap file

  security:
    certsSecretPrefix: "poc"
    authentication:
      enabled: true
      modes:
      - "SCRAM"
    tls:
      ca: "custom-ca"

  externalAccess:
    externalService:
      spec:
        type: LoadBalancer
        publishNotReadyAddress: true
        port: 27017

  podSpec:
    podTemplate:
      metadata:
        labels:
          name: pocbrace
        annotations:
          service.io.cilium/global: "true"
      spec:
        containers:
        - name: mongodb-enterprise-database
          ##image: 'quay.io/mongodb/mongodb-enterprise-database-ubi:1.33.0' ##MEKO
          image: 'quay.io/mongodb/mongodb-kubernetes-database:1.12.0' ##MCK
          resources:
            limits:
              memory: 2Gi
              cpu: 2
            requests:
              memory: 1Gi
              cpu: 1

    persistence:
      single:
        storage: 15Gi
        storageClass: efs-sc

  additionalMongodConfig:
    net:
      tls:
        mode: requireTLS
        allowConnectionsWithoutCertificates: true
      compression:
        compressors: "snappy,zstd"
    setParameter:
      tlsWithholdClientCertificate: true

  connectivity:
    replicaSetHorizons:
    - "pocbrace-svc-external": "adcc0f38584e441339a00782c880f742-1236254653.eu-central-1.elb.amazonaws.com:27017"
    - "pocbrace-svc-external": "aceb8e5c3228b4120955166427c600bb-69565488.eu-central-1.elb.amazonaws.com:27017"
    - "pocbrace-svc-external": "a4eb9084f16f24b24bd9825c0d671ee5-2038061561.eu-central-1.elb.amazonaws.com:27017"
