apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: single-gpu
spec:
  spec:
    devices:
      requests:
      - name: gpu
        exactly:
          deviceClassName: gpu.nvidia.com
          count: 1
---
apiVersion: ai.mongodb.com/v1
kind: VoyageAI
metadata:
  name: voyageai-example
  namespace: mongodb
spec:
  model: voyage-4-lite
  version: latest
  replicas: 1
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: "group"
          operator: In
          values:
          - "NVIDIA"
  resourceRequirements:
    claims:
    - name: single-gpu
    limits:
      cpu: "1"
      memory: 4G
      nvidia.com/gpu: "1"
    requests:
      cpu: "1"
      memory: 4G
      nvidia.com/gpu: "1"
