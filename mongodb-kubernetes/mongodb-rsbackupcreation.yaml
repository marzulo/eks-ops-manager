apiVersion: mongodb.com/v1
kind: MongoDB
metadata:
  name: rsbackup
  namespace: mongodb
spec:
  members: 3
  version: "8.0.26-ent"
  credentials: organization-secret
  type: ReplicaSet
  featureCompatibilityVersion: "8.0"
  persistent: true

  opsManager:
    configMapRef:
      name: rsbackup  # Must match metadata.name in ConfigMap file

  security:
    certsSecretPrefix: "bkp"
    authentication:
      enabled: true
      ignoreUnknownUsers: true   ## Disable authoritativeSet to False (Enforce Consistent Set)
      modes:
      - "X509"
      - "SCRAM"
      internalCluster: "X509"
      agents:
        mode: "X509"
    tls:
      ca: "custom-ca"

  externalAccess:
    externalService:
      spec:
        type: NodePort
#        publishNotReadyAddress: true
#        port: 27017

  podSpec:
    podTemplate:
      metadata:
        labels:
          name: rsbackup
          group: "ARM"
      spec:
        containers:
        - name: mongodb-enterprise-database
          ##image: 'quay.io/mongodb/mongodb-enterprise-database-ubi:1.33.0' ##MEKO
          image: 'quay.io/mongodb/mongodb-kubernetes-database:1.9.1' ##MCK
          resources:
            limits:
              memory: 2Gi
              cpu: "0.5"
            requests:
              memory: 2Gi
              cpu: "0.5"
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: "group"
                  operator: In
                  values:
                  - "ARM"
        tolerations:
        - key: "workload"
          operator: "Equal"
          value: "arm"
          effect: "NoSchedule"

    persistence:
      single:
        storage: 15Gi
        storageClass: efs-sc

  duplicateServiceObjects: true

  statefulSet:
    spec:
      serviceName: rsbackup-svc

  additionalMongodConfig:
    net:
      tls:
        mode: requireTLS
        allowConnectionsWithoutCertificates: true
      compression:
        compressors: "snappy,zstd"
---
