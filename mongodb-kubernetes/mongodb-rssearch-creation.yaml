apiVersion: mongodb.com/v1
kind: MongoDB
metadata:
  name: rssearch
  namespace: mongodb
spec:
  members: 3
  version: "8.3.11-ent"
  credentials: organization-secret
  type: ReplicaSet
  featureCompatibilityVersion: "8.0"
  persistent: true

  opsManager:
    configMapRef:
      name: rssearch  # Must match metadata.name in ConfigMap file

  security:
    certsSecretPrefix: "search"
    authentication:
      enabled: true
      ignoreUnknownUsers: true   ## Disable authoritativeSet to False (Enforce Consistent Set)
      requireClientTLSAuthentication: false
      modes:
      - "SCRAM"
    tls:
      ca: "custom-ca"

  externalAccess:
    externalService:
      spec:
        type: LoadBalancer
        publishNotReadyAddress: true
        port: 27017

  podSpec:
    podTemplate:
      metadata:
        labels:
          name: rssearch
          group: "ARM"
      spec:
        containers:
        - name: mongodb-enterprise-database
          ##image: 'quay.io/mongodb/mongodb-enterprise-database-ubi:1.33.0' ##MEKO
          image: 'quay.io/mongodb/mongodb-kubernetes-database:1.12.0' ##MCK
          resources:
            limits:
              memory: 4Gi
              cpu: "1"
            requests:
              memory: 4Gi
              cpu: "1"
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: "group"
                  operator: In
                  values:
                  - "ARM"
        tolerations:
        - key: "workload"
          operator: "Equal"
          value: "arm"
          effect: "NoSchedule"
  
    persistence:
      single:
        storage: 10Gi
        storageClass: efs-sc

  statefulSet:
    spec:
      serviceName: rssearch-svc

  additionalMongodConfig:
    net:
      tls:
        mode: requireTLS
        allowConnectionsWithoutCertificates: true

  backup:
    mode: enabled
    assignmentLabels: ["new"]
    snapshotSchedule:
      dailySnapshotRetentionDays: 2
      fullIncrementalDayOfWeek: "SUNDAY" 
      monthlySnapshotRetentionMonths: 0
      pointInTimeWindowHours: 1
      snapshotIntervalHours: 24
      snapshotRetentionDays: 2
      weeklySnapshotRetentionWeeks: 0

  connectivity:
    replicaSetHorizons:
    - "rssearch-svc-external": "af196f77dfb2e4ef69e10eb724127ea5-1085498505.eu-central-1.elb.amazonaws.com:27017"
    - "rssearch-svc-external": "a2b62d73e05bd4a25b4f1814d2e494f0-2066312776.eu-central-1.elb.amazonaws.com:27017"
    - "rssearch-svc-external": "af930dcc976d347e49424b8f41d244d1-1817107506.eu-central-1.elb.amazonaws.com:27017"
